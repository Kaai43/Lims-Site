services:
  - type: web
    name: lims-ifpi
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: RATE_LIMIT_JANELA
        value: 1 minute
      - key: LOG_LEVEL
        value: info
