services:
  - type: web
    name: lims-ifpi
    runtime: node
    plan: free
    # --include=dev é obrigatório: o build precisa de prisma/tsx/typescript/tailwind,
    # que são devDependencies. Sem a flag, NODE_ENV=production faz o npm omiti-las
    # e o build falha em "prisma: not found".
    buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy && npm run db:seed
    startCommand: npm start
    healthCheckPath: /saude
    envVars:
      # package.json exige node >=24; fixar evita o Render usar um Node antigo
      # e quebrar o binário nativo do better-sqlite3.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: RATE_LIMIT_JANELA
        value: 1 minute
      - key: LOG_LEVEL
        value: info
