<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesquisadores — LIMS</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- Cabeçalho completo (logos, menu e linha): visível no topo e ao rolar para baixo; sobe e some ao rolar para cima -->
  <div class="cabecalho" id="cabecalho" data-topo-visivel="true">
    <header class="topbar">
      <div class="logo" id="logo-left" aria-label="Símbolo esquerdo (placeholder)">LOGO</div>

      <div class="topbar__direita">
        <button type="button" id="menu-toggle" class="menu-toggle"
                aria-controls="menu-painel" aria-expanded="false" aria-label="Abrir menu">
          <span class="menu-toggle__linha"></span>
          <span class="menu-toggle__linha"></span>
          <span class="menu-toggle__linha"></span>
        </button>
        <div class="logo" id="logo-right" aria-label="Símbolo direito (placeholder)">LOGO</div>
      </div>
    </header>

    <!-- Linha reta ("corte") abaixo dos símbolos -->
    <div class="corte" id="corte" aria-hidden="true"></div>

    <nav id="menu-painel" class="menu-painel" aria-label="Menu principal" hidden>
      <ul>
        <li><a href="laboratorio.html">O Laboratório</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="eventos.html">Eventos</a></li>
        <li><a href="pesquisadores.html" aria-current="page">Pesquisadores</a></li>
        <li><a href="localizacoes.html">Localizações</a></li>
      </ul>
    </nav>

    <!-- Botão quadrado de tema abaixo da linha (some junto com o cabeçalho): lua no tema claro, sol no tema escuro -->
    <button type="button" id="theme-toggle" class="theme-toggle"
            aria-pressed="false" aria-label="Ativar tema escuro" title="Ativar tema escuro">
      <svg class="icone-lua" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/>
      </svg>
      <svg class="icone-sol" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
        <path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
      </svg>
    </button>
  </div>

  <main class="conteudo conteudo--pesquisadores">
    <h1 class="pagina-titulo pagina-titulo--destaque">Pesquisadores</h1>
    <section class="pesquisadores-lista" aria-label="Lista de pesquisadores">
      <article class="pesquisador-card">
        <img class="pesquisador-card__foto" src="../imagens/Professor fernando.jpeg" alt="Foto do Professor Fernando Castelo Branco Gonçalves Santana">
        <h2 class="pesquisador-card__nome">Fernando Castelo Branco Gonçalves Santana</h2>
        <p class="pesquisador-card__email">fernandosantana@ifpi.edu.br</p>
        <p class="pesquisador-card__formacao">Mestre em Ciência da Computação</p>
      </article>
      <article class="pesquisador-card">
        <img class="pesquisador-card__foto" src="../imagens/Professor Fábio.jpeg" alt="Foto do Professor Fabio de Jesus Lima Gomes">
        <h2 class="pesquisador-card__nome">Fabio de Jesus Lima Gomes</h2>
        <p class="pesquisador-card__email">fabio@ifpi.edu.br</p>
        <p class="pesquisador-card__formacao">Doutorado em Informatica na Educacao (UFRGS)</p>
      </article>
    </section>
  </main>

  <script src="../js/scroll.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
